# set the network device for satellite terminal and gateway.
nic:
  st: 192.168.4.1
  gw: 192.168.3.2

# configure the forward and return links available bandwidth (kb/s) 
bandwidth:
  forward: 128
  return: 128

# configure the delay (ms) according to the GEO, MEO or LEO satellite and the offset, real delay = delay + or - offset
delay:
  denomination: 40
  jitter: 10

# set the ACM simulation values (duration unit: time)
acm:
  - weight: 1
    duration: 10
  - weight: 0.8
    duration: 10
  - weight: 0.9
    duration: 10
  - weight: 0.5
    duration: 10
  - weight: 0.7
    duration: 10
  - weight: 0.1
    duration: 10
